; Reference firmware for the Archery Timer: serial protocol v1 + v2 (docs/protocol.md) and the mesh v2 radio
; (docs/mesh.md) on lib/meshcore (radio logic) and lib/hostcore (serial frame logic). Same sources for ../esp32c3.
; NOT yet run on hardware (compile-only plus native tests: firmware/test/native). Verify on real boards.
;
; The ESP-NOW code supports Arduino-ESP32 core 2.x and 3.x. If one of them fails to build,
; pin the platform, e.g. platform = espressif32@6.9.0 (core 2.0.17). Receive RSSI for the roster needs core 3.x
; (core 2.x reports 0).
;
; Build flags (-D):
;   MESHCORE_EXTERNAL_HMAC   required: meshcore uses mbedtls (meshglue.cpp) instead of its built-in SHA-256
;   ESPNOW_CHANNEL=1..13     default radio channel; the stored "chan" setting ($C,chan) overrides it
;   ESPNOW_DEFAULT_MODE=0..3 legacy mode on first boot when a v1 host never sends $R: 0 off (default), 1 bridge,
;                            2 follow (stand-alone box), 3 auto. A v2 host replaces it with $R.
;   PIN_GREEN/YELLOW/RED/HORN/FAULT=<gpio>, FAULT_ACTIVE_LOW=1, PIN_BTN1..4=<gpio>  pins (see outputs.cpp, buttons.cpp)
;   PIN_BEEP=<gpio> (default none), BEEP_HZ=2700, BOOT_CHIME=1   PWM beeper
; Removed with the v1 radio frames: ESPNOW_NET_KEY, ESPNOW_SLOT, NODE_ID (identity is the MAC, keys are in NVS).
; Sources live in src/ (shared with ../esp32c3). espnow_sync.* are obsolete and excluded.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
build_src_filter =
    +<*>
    -<espnow_sync.*>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESPNOW_CHANNEL=1
    -DMESHCORE_EXTERNAL_HMAC
    -DCORE_DEBUG_LEVEL=0

; Device with a host (Pi or PC) on USB. The host sets the role ($R) and the radio keys ($C).
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; Stand-alone light/sound box with no host: follows the mesh (needs a mesh key: $C,mkey over USB, or pairing).
[env:esp32-s3-standalone]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DESPNOW_DEFAULT_MODE=2
