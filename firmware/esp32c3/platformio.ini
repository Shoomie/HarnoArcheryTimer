; ESP32-C3 Super Mini build of the shared reference firmware (same sources as esp32s3/).
; NOT yet run on hardware (compile-only plus native tests).
;
; Pins (Super Mini): GPIO0 green, GPIO1 yellow, GPIO3 red, GPIO4 horn/buzzer driver,
; GPIO8 = onboard LED (active LOW) as the fault indicator. Buttons (to GND): GPIO5, 6, 7, 10.
; PWM beeper (piezo, or speaker via transistor): GPIO21 (remove -DPIN_BEEP to disable).
; Avoided on purpose: GPIO2, GPIO8 and GPIO9 are strapping pins (8 is only used for the LED,
; whose state at boot is harmless); GPIO18/19 are the native USB pins.
; Drive lamps and horn through a transistor or relay board, not straight from the pin.
; Other -D flags (ESPNOW_CHANNEL, ESPNOW_DEFAULT_MODE, MESHCORE_EXTERNAL_HMAC...) are documented in ../esp32s3/platformio.ini.
; Node identity is the MAC; keys live in NVS (set over USB with $C,mkey, or by pairing).
[platformio]
src_dir = ../esp32s3/src  ; one shared source set, no copy

[env]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
lib_extra_dirs = ../lib
build_src_filter =
    +<*>
    -<espnow_sync.*>
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DMESHCORE_EXTERNAL_HMAC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESPNOW_CHANNEL=1
    -DPIN_GREEN=0
    -DPIN_YELLOW=1
    -DPIN_RED=3
    -DPIN_HORN=4
    -DPIN_FAULT=8
    -DPIN_BEEP=21
    -DFAULT_ACTIVE_LOW=1
    -DPIN_BTN1=5
    -DPIN_BTN2=6
    -DPIN_BTN3=7
    -DPIN_BTN4=10

; With a host on USB. The host sets the role ($R) and the radio keys ($C).
[env:esp32c3-supermini]

; Stand-alone light/sound box with no host: follows the mesh (needs a mesh key or pairing).
[env:esp32c3-standalone]
build_flags =
    ${env.build_flags}
    -DESPNOW_DEFAULT_MODE=2
