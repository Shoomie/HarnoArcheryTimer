; Classic ESP32-WROOM-32D (ESP32 DevKit style board, CP2102 / CH340 / CH9102 USB-UART bridge, dual core
; Xtensa LX6, NO native USB). Same shared sources as ../esp32s3 and ../esp32c3, no copy.
; NOT yet run on hardware (compile-only plus native tests).
;
; Host link: UART0 (GPIO1 TX / GPIO3 RX) at 115200 through the on-board USB bridge. There are no
; ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT flags here: Serial is the plain UART0. The ROM bootloader prints
; text on UART0 at power-up; the host parser resyncs on newline and on '$' (hostlink.cpp). Most DevKits wire
; DTR/RTS to EN/IO0, so the host opens the port with both lines low (discovery.open_serial(bridge=True)).
;
; Pins (override any with -D, see ../esp32s3/platformio.ini for the flag list):
;   lights   green GPIO25, yellow GPIO26, red GPIO27        (active HIGH)
;   horn     GPIO32                                          (active HIGH)
;   fault    GPIO2 = on-board LED of most DevKits, active HIGH (FAULT_ACTIVE_LOW=0)
;   buttons  GPIO13, 14, 16, 17 to GND (internal pull-up)
;   beeper   GPIO23 PWM (piezo, or a speaker through a transistor); remove -DPIN_BEEP to disable
; Avoided on purpose: GPIO6-11 (SPI flash), GPIO34-39 (input only: no outputs, no internal pull-ups),
; strapping pins GPIO0/5/12/15 (GPIO2 is only the fault LED, harmless at boot), GPIO1/3 (UART0).
; Lamps and horn MUST be driven through a transistor, MOSFET or relay stage, never straight from the pin
; (about 12 mA per pin at most, 3.3 V logic).
; Node identity is the MAC; keys live in NVS (set over serial with $C,mkey, or by pairing).
[platformio]
src_dir = ../esp32s3/src  ; one shared source set, no copy

[env]
platform = espressif32
framework = arduino
board = esp32dev
lib_extra_dirs = ../lib
build_src_filter =
    +<*>
    -<espnow_sync.*>
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DMESHCORE_EXTERNAL_HMAC
    -DESPNOW_CHANNEL=1
    -DPIN_GREEN=25
    -DPIN_YELLOW=26
    -DPIN_RED=27
    -DPIN_HORN=32
    -DPIN_FAULT=2
    -DPIN_BEEP=23
    -DFAULT_ACTIVE_LOW=0
    -DPIN_BTN1=13
    -DPIN_BTN2=14
    -DPIN_BTN3=16
    -DPIN_BTN4=17

; With a host on the USB-UART bridge. The host sets the role ($R) and the radio keys ($C).
[env:esp32-wroom-32d]

; Stand-alone light/sound box with no host: follows the mesh (needs a mesh key or pairing).
[env:esp32-wroom-32d-standalone]
build_flags =
    ${env.build_flags}
    -DESPNOW_DEFAULT_MODE=2
